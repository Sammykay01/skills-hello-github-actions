name: Post welcome comment

on:
  pull_request:
    types:
      - opened

permissions:
  pull-requests: write

jobs:
  welcome:
    name: Post welcome comment
    runs-on: ubuntu-latest

    steps:
      # Pin Node to a stable version to avoid "exports" / Node runtime issues
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # GitHub CLI is available on ubuntu-latest, this just verifies it's usable
      - name: Verify GitHub CLI
        run: gh --version

      - name: Comment on new pull request
        run: |
          gh pr comment "$PR_URL" \
            --body "Welcome to the repository!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

